<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexo OS</title>
<meta name="description" content="Nexo OS: sistema operativo para negocios locales. Ventas, caja, stock, gastos y finanzas en un panel.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0607">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<a class="skip-link" href="#view">Saltar al contenido</a>
<div class="app no-shell" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="brand-mark" id="brandMark" aria-hidden="true">NX</span>
      <div class="brand-text"><span class="brand-name" id="brandName">Nexo OS</span><span class="brand-sub" id="brandSub"></span></div>
    </div>
    <nav aria-label="Navegación principal"><ul class="nav-list" id="navList"></ul></nav>
    <div class="user-card">
      <span class="user-avatar" id="userInitial" aria-hidden="true"></span>
      <div class="user-info"><strong id="userName"></strong><span id="userRole"></span></div>
      <button type="button" class="btn btn-ghost btn-icon" id="logoutBtn" aria-label="Cerrar sesión"></button>
    </div>
  </aside>
  <div class="main-wrap" id="mainWrap">
    <header class="topbar" role="banner">
      <a class="topbar-logo" href="#/dashboard" aria-label="Nexo OS, ir al dashboard"><span class="brand-mark sm" aria-hidden="true">NX</span></a>
      <span class="topbar-date" id="topDate"></span>
      <a class="cash-pill is-closed" id="cashPill" href="#/caja"><span class="dot" aria-hidden="true"></span><span id="cashPillText">Caja cerrada</span><span class="cash-amt" id="cashPillAmt"></span></a>
      <span class="spacer"></span>
      <a class="btn btn-primary" id="topSale" href="#/ventas"></a>
      <a class="btn btn-secondary hide-sm" id="topExpense" href="#/gastos?nuevo=1"></a>
      <a class="btn btn-ghost btn-icon bell-btn" id="bell" href="#/notificaciones" aria-label="Notificaciones"></a>
    </header>
    <div class="chipnav-wrap" id="chipWrap"><nav aria-label="Secciones"><ul class="chipnav" id="chipList"></ul></nav></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<noscript><p style="padding:24px">Esta aplicación requiere JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
