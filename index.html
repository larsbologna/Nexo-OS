<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexo OS</title>
<meta name="description" content="Nexo OS: sistema operativo para negocios locales. Ventas, stock, gastos y finanzas en un panel.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..750&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<a class="skip-link" href="#view">Saltar al contenido</a>
<div class="app no-shell" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="brand-mark" id="brandMark" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="13.5" cy="18" r="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="22.5" cy="18" r="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="28.5" cy="8.5" r="2.8" fill="#EDB04F"/></svg></span>
      <div class="brand-text"><span class="brand-name" id="brandName">Nexo OS</span><span class="brand-sub" id="brandSub"></span></div>
    </div>
    <nav aria-label="Navegación principal"><ul class="nav-list" id="navList"></ul></nav>
    <div class="user-card">
      <span class="user-avatar" id="userInitial" aria-hidden="true"></span>
      <div class="user-info"><strong id="userName"></strong><span id="userRole"></span></div>
      <button type="button" class="btn btn-ghost btn-icon" id="logoutBtn" aria-label="Cerrar sesión"></button>
    </div>
  </aside>
  <div class="main-wrap" id="mainWrap">
    <header class="topbar" role="banner">
      <a class="topbar-logo" href="#/dashboard" aria-label="Nexo OS, ir al dashboard"><span class="brand-mark sm" aria-hidden="true"><svg viewBox="0 0 36 36"><circle cx="13.5" cy="18" r="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="22.5" cy="18" r="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="28.5" cy="8.5" r="2.8" fill="#EDB04F"/></svg></span></a>
      <span class="topbar-date" id="topDate"></span>
      <span class="spacer"></span>
      <a class="btn btn-primary" id="topSale" href="#/ventas"></a>
      <a class="btn btn-secondary hide-sm" id="topExpense" href="#/gastos?nuevo=1"></a>
      <a class="btn btn-ghost btn-icon bell-btn" id="bell" href="#/notificaciones" aria-label="Notificaciones"></a>
    </header>
    <div class="chipnav-wrap" id="chipWrap"><nav aria-label="Secciones"><ul class="chipnav" id="chipList"></ul></nav></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<noscript><p style="padding:24px">Esta aplicación requiere JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
